<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
<title id="title">AI agents: same MCP tool name, new instructions</title><desc id="desc">Assume the MCP server changes its description after review. Name-only approval admits the changed text to model input. A reviewed definition snapshot holds the changed tools for re-review.</desc>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Chalkboard, Comic Sans MS, DejaVu Sans, sans-serif"><text x="65" y="90.0" font-size="46" fill="#20262c" font-weight="normal">AI agents: same MCP tool name, new instructions</text><text x="65" y="148.0" font-size="29" fill="#525963" font-weight="normal">Assume the server changes its tool description after review.</text><text x="75" y="241.0" font-size="25" fill="#b44336" font-weight="normal">CONTROL · Name-only approval</text><text x="75" y="313.0" font-size="29" fill="#20262c" font-weight="normal">read_note</text><text x="75" y="353.02" font-size="29" fill="#20262c" font-weight="normal">changed description</text><path d="M402 299 Q522.5 301.0 643 299" fill="none" stroke="#b44336" stroke-width="3" stroke-linecap="round"/><path d="M630 290 L643 299 L630 308" fill="none" stroke="#b44336" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="689" y="294.0" font-size="31" fill="#b44336" font-weight="normal">Same name → admitted</text><text x="689" y="336.78" font-size="31" fill="#b44336" font-weight="normal">New text reaches model input</text><path d="M66 371 Q745.0 372.0 1424 369" fill="none" stroke="#d4d5d7" stroke-width="2" stroke-linecap="round"/><text x="75" y="426.0" font-size="25" fill="#087e80" font-weight="normal">INTERVENTION · Reviewed snapshot</text><text x="75" y="491.0" font-size="29" fill="#20262c" font-weight="normal">read_note</text><text x="75" y="531.02" font-size="29" fill="#20262c" font-weight="normal">same changed description</text><path d="M440 482 Q541.5 484.0 643 482" fill="none" stroke="#087e80" stroke-width="3" stroke-linecap="round"/><path d="M630 473 L643 482 L630 491" fill="none" stroke="#087e80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="689" y="478.0" font-size="31" fill="#087e80" font-weight="normal">Definition differs → held</text><text x="689" y="520.78" font-size="31" fill="#087e80" font-weight="normal">Re-review before model input</text></g></svg>